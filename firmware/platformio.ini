; Atech Duck firmware — ESP32-S3 (Atech 14-port motherboard) driving an
; Open-Duck-Mini-v2-class biped over one Feetech STS bus (Atech robot_arm module).
;
;   pio run                      # build (default env: bus + IMU + eyes + feet + speaker + ToF)
;   pio run -e atech_duck_bare   # bus + IMU + policy only
;   pio run -t upload            # flash over USB-C
;   pio device monitor           # JSON lines @115200; type HELP
;
; Port map (backend/motherboard/board.yaml — Line A / Line B GPIO):
;   port 1  (9/8)    IMU icm40608     SDA=A  SCL=B      Wire
;   port 2  (5/4)    ToF vl53l5cx     SCL=A  SDA=B      Wire1
;   port 3  (17/18)  servo bus        TX=A (330R) RX=B  Serial1 @ 1 Mbps  <- robot_arm module hardware
;   port 4  (16/15)  button (A)       spare (B)
;   port 5  (11/10)  foot switches    left=A right=B    (bare lines, pull-up, closed = LOW)
;   port 6  (13/12)  antenna servos   left=A right=B    (LEDC 50 Hz)
;   port 7  (6/7)    NeoPixel eyes    RGB rev=A RGBW rev=B
;   port 9+10        microphone       (not used by the control loop; left free)
;   port 13+14 (39/38, 36/35) speaker LRCLK=A1 BCLK=B1 DIN=B2
;   port 11 (43/44)  free

[platformio]
default_envs = atech_duck

[env]
platform = espressif32@~6.4.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_unflags = -Os
build_flags =
    -O2
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBUS_TX_PIN=17
    -DBUS_RX_PIN=18
    -DIMU_SDA_PIN=9
    -DIMU_SCL_PIN=8
    -DTOF_SCL_PIN=5
    -DTOF_SDA_PIN=4
    -DBTN_PIN=16
    -DFOOT_L_PIN=11
    -DFOOT_R_PIN=10
    -DANT_L_PIN=13
    -DANT_R_PIN=12
    -DEYES_PIN_A=6
    -DEYES_PIN_B=7
    -DSPK_LRCLK_PIN=39
    -DSPK_BCLK_PIN=38
    -DSPK_DIN_PIN=35
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    sparkfun/SparkFun VL53L5CX Arduino Library@^1.0.3

[env:atech_duck]
build_flags =
    ${env.build_flags}
    -DDUCK_HAS_EYES=1
    -DDUCK_HAS_FEET=1
    -DDUCK_HAS_SPEAKER=1
    -DDUCK_HAS_TOF=1
    -DDUCK_HAS_BUTTON=1

[env:atech_duck_bare]
build_flags =
    ${env.build_flags}
